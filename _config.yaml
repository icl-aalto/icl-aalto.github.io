# site properties and page defaults
# GENERATED from website-agent/lab.yaml by scripts/sync.rb — edit lab.yaml instead
title: "ICL"
subtitle: "Intelligent Convergence Lab"
description: "Intelligent Convergence Lab at Department of Computer Science, Aalto University and ELLIS Institute Finland. Trustworthy and efficient machine learning."
header: images/header.svg
footer: images/header.svg
proofer: false
header-dark: false
logo-text: false
email-display: "qi [dot] chen [dot] inf [at] aalto.fi"

# site social media and other links
links:
  github: icl-aalto

### jekyll settings

# front matter defaults
defaults:
  # all markdown files
  - scope:
      path: ""
    values:
      layout: default
  # markdown files in /_members
  - scope:
      type: "members"
    values:
      layout: member
  # markdown files in /_posts
  - scope:
      type: "posts"
    values:
      layout: post

collections:
  # generate page for each member
  members:
    output: true
  # generate page for each post
  posts:
    output: true

# jekyll plugins
plugins:
  - jekyll-spaceship
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-feed
  - jekyll-last-modified-at

# code block syntax highlighting
highlighter: rouge

# jekyll theme
theme: null

# sass settings
sass:
  sass_dir: _styles

# force jekyll to include certain files/folders
include:
  - _styles
  - _scripts
  # website-agent: 让 GitHub Pages 不再二次运行 Jekyll (否则 _styles/ 等下划线目录会 404)
  - .nojekyll

# force jekyll to exclude certain files/folders
exclude:
  - README.md
  - LICENSE.md
  - CITATION.cff

# configure jekyll spaceship
jekyll-spaceship:
  mathjax-processor:
    src:
      - https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js
